<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dallin H. Oaks Profile Card</title>
    <style>
        body {
            background-color: #FFECD7;
            font-family: Helvetica, sans-serif;
        }

        .card {
            background-color: #008DB1;
            border: 4px solid #004E63;
            border-radius: 20px;
            width: 300px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            color: #FFFFFF;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        a {
            color: #91E4FB;
            font-size: 14px;
            display: block;
            margin: 8px 0 15px;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        img {
            width: 180px;
            border: 3px solid #FFFFFF;
        }

        ul {
            text-align: left;
            display: inline-block;
            margin: 15px 0;
            padding-left: 20px;
        }

        .quote {
            color: #FFD783;
            font-family: 'Brush Script MT', cursive;
            font-size: 18px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dallin H. Oaks</h1>
        <a href="https://www.churchofjesuschrist.org" target="_blank">18th President of the Church of Jesus Christ of Latter-day Saints</a>
        
        <img src="dallin_oaks.jpg" alt="Dallin H. Oaks">

        <ul>
            <li>Born: Aug 12, 1932</li>
            <li>Apostle: Apr 7, 1984</li>
            <li>Prophet: Oct 14, 2025</li>
        </ul>

        <p class="quote">"The gospel of Jesus Christ teaches us that our highest priority is to love God and to love our fellowmen."</p>
    </div>

</body>
</html>
